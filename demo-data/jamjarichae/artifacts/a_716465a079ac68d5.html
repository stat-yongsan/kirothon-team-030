<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회식 날짜 투표</title><style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#10162b;color:#eef;line-height:1.5}main{max-width:480px;margin:0 auto;padding:16px}h1{font-size:22px;margin:8px 0}h2{font-size:16px;margin:0 0 8px}.note{font-size:12px;color:#aab;background:#1b2340;padding:8px;border-radius:8px}.card{background:#1b2340;border-radius:12px;padding:12px;margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;border:1px solid #4a5a99;background:#232d55;color:#eef;border-radius:8px;padding:8px 10px;cursor:pointer}button.on{background:#ffd54a;color:#222;border-color:#ffd54a}.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.bar span.l{width:78px;flex:none}.track{flex:1;background:#10162b;border-radius:6px;height:16px;overflow:hidden;min-width:0}.fill{height:100%;background:#6c8cff;width:0;transition:width .3s}.fill.top{background:#ffd54a}.n{width:48px;text-align:right;flex:none}#best{font-size:16px;font-weight:bold;color:#ffd54a;word-break:keep-all}#who{font-size:13px;color:#aab;margin-top:6px;word-break:keep-all}</style></head><body><main><h1>🌙 회식 날짜 투표</h1><p class="note">이 페이지의 이름과 날짜는 모두 가상 샘플입니다. 저장되지 않으며 새로고침하면 처음 상태로 돌아갑니다.</p><div class="card"><h2>1. 투표할 사람 고르기</h2><div class="row" id="people"></div></div><div class="card"><h2>2. 가능한 날짜 누르기 (<span id="cur"></span>)</h2><div class="row" id="dates"></div><div class="row" style="margin-top:8px"><button id="clear">이 사람 선택 모두 지우기</button><button id="reset">전체 초기화</button></div></div><div class="card"><h2>3. 현재 결과</h2><div id="bars"></div><p id="best"></p><p id="who"></p></div></main><script>var P=['민지','준호','서연','도윤','하늘'];var D=['6/12(목)','6/13(금)','6/19(목)','6/20(금)','6/26(목)'];var INIT={'민지':[1,3],'준호':[1,2],'서연':[3,4],'도윤':[1,3],'하늘':[]};var votes,cur=0;function init(){votes={};P.forEach(function(p){votes[p]=INIT[p].slice()});}init();var pe=document.getElementById('people'),de=document.getElementById('dates'),be=document.getElementById('bars');function draw(){pe.innerHTML='';P.forEach(function(p,i){var b=document.createElement('button');b.textContent=p+' ('+votes[p].length+')';if(i===cur)b.className='on';b.onclick=function(){cur=i;draw()};pe.appendChild(b)});document.getElementById('cur').textContent=P[cur]+' 님';de.innerHTML='';D.forEach(function(d,j){var b=document.createElement('button');var on=votes[P[cur]].indexOf(j)>=0;b.textContent=(on?'✔ ':'')+d;if(on)b.className='on';b.onclick=function(){var a=votes[P[cur]],k=a.indexOf(j);if(k>=0)a.splice(k,1);else a.push(j);draw()};de.appendChild(b)});var c=D.map(function(_,j){return P.filter(function(p){return votes[p].indexOf(j)>=0})});var m=Math.max.apply(null,c.map(function(x){return x.length}));be.innerHTML='';D.forEach(function(d,j){var r=document.createElement('div');r.className='bar';var pct=P.length?c[j].length/P.length*100:0;r.innerHTML='<span class="l">'+d+'</span><div class="track"><div class="fill'+(m>0&&c[j].length===m?' top':'')+'" style="width:'+pct+'%"></div></div><span class="n">'+c[j].length+'/'+P.length+'</span>';be.appendChild(r)});var bs=document.getElementById('best'),w=document.getElementById('who');if(m===0){bs.textContent='아직 투표가 없습니다.';w.textContent='';return}var tops=[];D.forEach(function(d,j){if(c[j].length===m)tops.push(j)});bs.textContent=(tops.length>1?'공동 1위: ':'추천 날짜: ')+tops.map(function(j){return D[j]}).join(', ')+' ('+m+'명 가능)';var j0=tops[0];var no=P.filter(function(p){return votes[p].indexOf(j0)<0});w.textContent=no.length?(D[j0]+' 불참 가능: '+no.join(', ')):(D[j0]+' 전원 가능')}document.getElementById('clear').onclick=function(){votes[P[cur]]=[];draw()};document.getElementById('reset').onclick=function(){init();draw()};draw();</script></body></html>
